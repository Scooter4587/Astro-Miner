name: Push changelog to Discord

on:
  push:
    branches: [ "main" ]
    paths:
      - "CHANGELOG.md"
      - ".github/workflows/changelog_to_discord.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Extract latest block
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          awk '
            BEGIN {in_section=0}
            /^## / {
              if (in_section==0) {in_section=1; print; next}
              else {exit}
            }
            {
              if (in_section==1) print
            }
          ' CHANGELOG.md > latest.txt

          if ! [ -s latest.txt ]; then
            echo "ERROR: No release block found in CHANGELOG.md" >&2
            exit 1
          fi

          header_line="$(head -n 1 latest.txt)"
          version="$(echo "$header_line" | sed -E 's/^##[[:space:]]+(.+)$/\1/')"

          tail -n +2 latest.txt > body.txt

          rm -f Added.txt Changed.txt Fixed.txt Notes.txt Released.txt || true
          awk '
            BEGIN {sec=""}
            { gsub(/\r$/,"") }
            /^### Added$/    {sec="Added"; next}
            /^### Changed$/  {sec="Changed"; next}
            /^### Fixed$/    {sec="Fixed"; next}
            /^### Notes$/    {sec="Notes"; next}
            /^### Released$/ {sec="Released"; next}
            NF==0 {next}
            sec!="" {print $0 >> (sec".txt")}
          ' body.txt

          ADDED="$(cat Added.txt 2>/dev/null || true)"
          CHANGED="$(cat Changed.txt 2>/dev/null || true)"
          FIXED="$(cat Fixed.txt 2>/dev/null || true)"
          NOTES="$(cat Notes.txt 2>/dev/null || true)"
          RELEASED="$(cat Released.txt 2>/dev/null || true)"

          {
            echo "version=$version"
            echo "released<<EOF"
            echo "$RELEASED"
            echo "EOF"
            echo "added<<EOF"
            echo "$ADDED"
            echo "EOF"
            echo "changed<<EOF"
            echo "$CHANGED"
            echo "EOF"
            echo "fixed<<EOF"
            echo "$FIXED"
            echo "EOF"
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION:     ${{ steps.extract.outputs.version }}
          RELEASED:    ${{ steps.extract.outputs.released }}
          ADDED:       ${{ steps.extract.outputs.added }}
          CHANGED:     ${{ steps.extract.outputs.changed }}
          FIXED:       ${{ steps.extract.outputs.fixed }}
          NOTES:       ${{ steps.extract.outputs.notes }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y >/dev/null 2>&1 || true
          sudo apt-get install -y jq >/dev/null 2>&1 || true

          WEBHOOK_URL="$(printf '%s' "$WEBHOOK_URL" | tr -d '\r\n')"

          FIELDS='[]'
          add_field () {
            local name="$1"
            local val="$2"
            if [ -n "${val// /}" ]; then
              FIELDS="$(echo "$FIELDS" | jq --arg n "$name" --arg v "$val" '. + [{name:$n, value:$v, inline:false}]')"
            fi
          }

          add_field "Added"   "$ADDED"
          add_field "Changed" "$CHANGED"
          add_field "Fixed"   "$FIXED"
          add_field "Notes"   "$NOTES"

          if [ -z "${RELEASED// /}" ]; then
            RELEASED="$(date -u +%F)"
          fi

          PAYLOAD="$(jq -n \
            --arg title "AstroMiner – ${VERSION}" \
            --arg released "${RELEASED}" \
            --argjson fields "${FIELDS}" \
            '{
              embeds: [{
                title: $title,
                color: 3447003,
                fields: $fields,
                footer: { text: ("Released " + $released) }
              }]
            }')"

          RESP="$(curl -sS -w '\n%{http_code}' \
                 -H 'Content-Type: application/json' \
                 -X POST \
                 -d "$PAYLOAD" \
                 "$WEBHOOK_URL")"

          HTTP_CODE="$(printf '%s' "$RESP" | tail -n1)"
          BODY="$(printf '%s' "$RESP" | sed '$d')"

          echo "Discord HTTP code: $HTTP_CODE"
          echo "Discord body: $BODY"

          test "$HTTP_CODE" = "204" -o "$HTTP_CODE" = "200"